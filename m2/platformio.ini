; Nivelador M2 de EULER finder (demo JIJE). Placa: ESP32-C3 SuperMini.
[platformio]
default_envs = supermini

[env:supermini]
; Versiones fijadas: el QR del manual apunta a este commit y display.cpp usa la API 2.x de Arduino-ESP32.
platform = espressif32 @ 7.1.3
; La SuperMini no tiene entrada propia en PlatformIO; usa la del devkit C3 (mismo chip).
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; USB CDC al arrancar: Serial sale por el USB nativo del C3 (GPIO18/19).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall -Wextra
lib_deps =
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit GC9A01A @ 1.1.0
    adafruit/Adafruit BusIO @ 1.17.4
